<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .calculator {
      width: 280px;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0002;
    }

    h1 { text-align: center; font-size: 25px; }

    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
      border-radius: 8px;
    }

    input, select { border: 1px solid #aaa; }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
    }

    #result { text-align: center; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>Calculator</h1>

    <input type="number" id="num1" placeholder="First number"
      step="any">

    <select id="operator" aria-label="Operation">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (-)</option>
      <option value="*">Multiplication (×)</option>
      <option value="/">Division (÷)</option>
    </select>

    <input type="number" id="num2" placeholder="Second number"
      step="any">

    <button id="calculate">Calculate</button>
    <button id="clear">Clear</button>

    <h3 id="result" aria-live="polite">Result: —</h3>
  </div>

  <script>
    const num1 = document.getElementById("num1");
    const num2 = document.getElementById("num2");
    const operator = document.getElementById("operator");
    const result = document.getElementById("result");

    document.getElementById("calculate").addEventListener("click", () => {
      if (num1.value.trim() === "" || num2.value.trim() === "") {
        result.textContent = "Please enter both numbers.";
        return;
      }

      const a = Number(num1.value);
      const b = Number(num2.value);
      let answer;

      switch (operator.value) {
        case "+":
          answer = a + b;
          break;
        case "-":
          answer = a - b;
          break;
        case "*":
          answer = a * b;
          break;
        case "/":
          if (b === 0) {
            result.textContent = "Cannot divide by zero.";
            return;
          }
          answer = a / b;
          break;
      }

      result.textContent = "Result: " + answer;
    });

    document.getElementById("clear").addEventListener("click", () => {
      num1.value = "";
      num2.value = "";
      operator.value = "+";
      result.textContent = "Result: —";
    });
  </script>
</body>
</html>
