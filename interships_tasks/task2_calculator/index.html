<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .calculator {
      width: 320px;
      max-width: 95vw;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px #0002;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    #display {
      width: 100%;
      height: 65px;
      font-size: 26px;
      text-align: right;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      padding: 16px 5px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      background: #e8edf5;
      cursor: pointer;
    }

    button:hover {
      background: #d5deed;
    }

    .operator {
      background: #cfe0ff;
    }

    .clear {
      background: #ffb8b8;
    }

    .equal {
      background: #9be5b0;
    }

    #message {
      min-height: 20px;
      color: #c62828;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="calculator">
    <h2>Calculator</h2>

    <input
      id="display"
      type="text"
      value="0"
      readonly
      aria-label="Calculator display"
    >

    <div class="buttons">
      <button class="clear" onclick="clearAll()">C</button>
      <button onclick="backspace()">⌫</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="digit('7')">7</button>
      <button onclick="digit('8')">8</button>
      <button onclick="digit('9')">9</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="digit('4')">4</button>
      <button onclick="digit('5')">5</button>
      <button onclick="digit('6')">6</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="digit('1')">1</button>
      <button onclick="digit('2')">2</button>
      <button onclick="digit('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="digit('0')">0</button>
      <button onclick="decimal()">.</button>
    </div>

    <p id="message" role="status"></p>
  </main>

  <script>
    const display = document.getElementById("display");
    const message = document.getElementById("message");

    let firstNumber = null;
    let operator = null;
    let waitingForNumber = false;

    function digit(number) {
      message.textContent = "";

      if (waitingForNumber || display.value === "0") {
        display.value = number;
        waitingForNumber = false;
      } else if (display.value.length < 15) {
        display.value += number;
      }
    }

    function decimal() {
      if (waitingForNumber) {
        display.value = "0.";
        waitingForNumber = false;
      } else if (!display.value.includes(".")) {
        display.value += ".";
      }
    }

    function chooseOperator(op) {
      message.textContent = "";

      if (operator && !waitingForNumber) {
        calculate();
        if (operator === null) return;
      }

      firstNumber = Number(display.value);
      operator = op;
      waitingForNumber = true;
    }

    function calculate() {
      if (operator === null || waitingForNumber) {
        message.textContent = "Enter a second number.";
        return;
      }

      const secondNumber = Number(display.value);
      let answer;

      switch (operator) {
        case "+":
          answer = firstNumber + secondNumber;
          break;
        case "-":
          answer = firstNumber - secondNumber;
          break;
        case "*":
          answer = firstNumber * secondNumber;
          break;
        case "/":
          if (secondNumber === 0) {
            message.textContent = "Cannot divide by zero!";
            return;
          }
          answer = firstNumber / secondNumber;
          break;
      }

      if (!Number.isFinite(answer)) {
        message.textContent = "Invalid calculation.";
        return;
      }

      display.value = String(
        Number(answer.toPrecision(12))
      );

      firstNumber = null;
      operator = null;
      waitingForNumber = true;
      message.textContent = "";
    }

    function clearAll() {
      display.value = "0";
      firstNumber = null;
      operator = null;
      waitingForNumber = false;
      message.textContent = "";
    }

    function backspace() {
      if (waitingForNumber) return;

      display.value =
        display.value.length > 1
          ? display.value.slice(0, -1)
          : "0";

      message.textContent = "";
    }

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) digit(event.key);
      else if (event.key === ".") decimal();
      else if (["+", "-", "*", "/"].includes(event.key)) {
        chooseOperator(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        calculate();
      } else if (event.key === "Escape") {
        clearAll();
      } else if (event.key === "Backspace") {
        backspace();
      }
    });
  </script>
</body>
</html>
